# dsh-chloe-ding 的 bundle 层 patch —— 它作为 profile 的 bundles 一员被装配。
#
# 两种装法：
#   1. 开发期（file:/// 路径）：把那行 name 改成
#      name: 'file:///C:/…/dsh-chloe-ding/index.mjs'，追加到 profile 的 cordis.patch.yml 末尾。
#      Windows 上必须是 file:///，裸盘符会被当成 URL scheme。
#   2. 正式装法（当前用的就是这个）：把本目录 link 进 profile 的 node_modules，
#      再把 "dsh-chloe-ding" 加进 profile package.json 的 dsh.profile.bundles。
#      这时 name 写包名 —— 客户端（client.js）也只有这种装法才会被扫到。
#
# 改完都要重启 DSH（配置层除外，cordis.patch.yml 会热加载）。
# 2026-10-25：id 与包名对齐 —— 设置命名空间按条目 id 走，两边不一致时设置页会拿不到 scope。
- insert:
    - id: dsh-chloe-ding
      name: 'dsh-chloe-ding'
